<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月次報告カードメーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: 左に入力フォーム、右にカードプレビュー（スマホでは縦積み） */
:root{
  --bg:#f1f3f6; --panel:#ffffff; --fg:#1a2233; --muted:#5b6475; --line:#d6dbe3;
  --accent:#1c2a44; --brass:#a9844e; --field:#f6f7fa;
  --serif:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161f; --panel:#1a202c; --fg:#e8ebf1; --muted:#98a2b5; --line:#2d3546;
  --accent:#a9bce0; --brass:#d1ad74; --field:#212837; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --panel:#1a202c; --fg:#e8ebf1; --muted:#98a2b5; --line:#2d3546;
  --accent:#a9bce0; --brass:#d1ad74; --field:#212837; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
header{max-width:1040px;margin:0 auto 22px}
h1{font-family:var(--serif);font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:500;color:var(--muted);letter-spacing:.04em}
input,select{font:inherit;font-size:1rem;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%;box-sizing:border-box}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:.78rem;color:var(--muted);line-height:1.6;margin:0}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:6px;padding:11px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--panel)}
button.ghost{background:transparent;color:var(--accent)}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns button{flex:1}
.preview{min-width:0;display:flex;flex-direction:column;gap:10px}
.preview img{width:100%;max-width:560px;border-radius:6px;box-shadow:0 10px 30px rgba(20,28,48,.2);display:block}
.save{font-size:.85rem;color:var(--muted);margin:0}
.toast{font-size:.82rem;color:var(--brass);min-height:1.2em;margin:0}
</style>
</head>
<body>

<header>
  <h1>月次報告カードメーカー</h1>
  <p>お名前・月・件数を入れるだけで、お客様に送るカード画像ができあがります。</p>
</header>

<div class="wrap">
  <form class="panel" id="f">
    <label for="name">お客様のお名前
      <input id="name" value="山田 太郎" autocomplete="off">
    </label>
    <div class="row">
      <label for="month">対象月
        <select id="month"></select>
      </label>
      <label for="count">新規報告件数
        <input id="count" type="number" min="0" inputmode="numeric" value="12">
      </label>
    </div>
    <label for="sender">差出人（任意）
      <input id="sender" value="" placeholder="例：〇〇不動産 物件紹介チーム" autocomplete="off">
    </label>
    <p class="hint">入力するとカードがすぐ更新されます。上の値はサンプルです。</p>
    <div class="btns">
      <button type="button" id="save">画像を保存</button>
      <button type="button" class="ghost" id="copy">文面をコピー</button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
  </form>

  <section class="preview">
    <img id="out" alt="報告カードのプレビュー">
    <p class="save">「画像を保存」を押すと、パソコンはそのままダウンロード、スマホは保存メニューが開きます（iPhoneは「画像を保存」を選択）。うまくいかない時は画像を長押しして保存してください。</p>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const ms=$('month');
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'月';ms.appendChild(o)}
ms.value=((new Date().getMonth()+11)%12)||12; // 前月を初期値に

const W=1080,H=1500;
const C={paper:'#f4f2ec',ink:'#1a2233',green:'#1c2a44',brass:'#a9844e',soft:'#5b6475',tint:'#e6eaf1',line:'#cfc6b4'};
const SERIF='"Zen Old Mincho","Hiragino Mincho ProN",serif',SANS='"Zen Kaku Gothic New","Hiragino Sans",sans-serif',LAT='"Cormorant Garamond",Georgia,serif';

function wrap(ctx,text,x,y,maxW,lh){
  let line='';const lines=[];
  for(const ch of text){
    if(ch==='\n'){lines.push(line);line='';continue}
    const t=line+ch;
    if(ctx.measureText(t).width>maxW && line){
      if('、。」）'.includes(ch)){lines.push(t);line='';continue} // 句読点を行頭にしない
      lines.push(line);line=ch;
    }else line=t;
  }
  if(line)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
  return lines.length*lh;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return}ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function msg(){
  const n=$('name').value.trim()||'〇〇',m=ms.value,c=$('count').value||'0';
  return {n,m,c};
}

function draw(){
  const {n,m,c}=msg();const sender=$('sender').value.trim();
  const cv=document.createElement('canvas');lastCanvas=cv;cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.textBaseline='alphabetic';
  // paper
  x.fillStyle=C.paper;x.fillRect(0,0,W,H);
  // inner frame
  x.strokeStyle=C.line;x.lineWidth=2;x.strokeRect(36,36,W-72,H-72);
  x.strokeStyle=C.brass;x.lineWidth=1;x.strokeRect(48,48,W-96,H-96);

  const L=110,R=W-110,CW=R-L;
  // eyebrow
  x.fillStyle=C.brass;x.font=`600 30px ${LAT}`;
  x.letterSpacing='8px';x.fillText('MONTHLY  REPORT',L,140);x.letterSpacing='0px';
  x.textAlign='right';x.font=`600 30px ${LAT}`;x.fillText(`No. ${String(m).padStart(2,'0')}`,R,140);x.textAlign='left';
  x.strokeStyle=C.brass;x.lineWidth=1.5;x.beginPath();x.moveTo(L,165);x.lineTo(R,165);x.stroke();

  // name
  x.fillStyle=C.ink;x.font=`700 68px ${SERIF}`;
  let nm=n;while(x.measureText(nm+' さま').width>CW && nm.length>1)nm=nm.slice(0,-1);
  x.fillText(nm,L,275);
  const nw=x.measureText(nm).width;x.font=`500 44px ${SERIF}`;x.fillText(' さま',L+nw,275);
  x.font=`500 34px ${SANS}`;x.fillStyle=C.soft;x.fillText('いつもありがとうございます。',L,345);

  // count block
  const by=400,bh=360;
  x.fillStyle=C.green;rr(x,L,by,CW,bh,8);x.fill();
  x.fillStyle='#d9c9a6';x.font=`500 34px ${SANS}`;x.textAlign='center';
  x.fillText(`${m}月の新規報告件数`,W/2,by+80);
  x.fillStyle='#ffffff';x.font=`600 210px ${LAT}`;
  const cw=x.measureText(c).width;x.font=`700 54px ${SERIF}`;const kw=x.measureText('件').width;
  const sx=W/2-(cw+12+kw)/2;x.textAlign='left';
  x.font=`600 210px ${LAT}`;x.fillText(c,sx,by+275);
  x.font=`700 54px ${SERIF}`;x.fillText('件',sx+cw+12,by+275);
  x.fillStyle='#d9c9a6';x.font=`500 26px ${SANS}`;x.textAlign='center';x.fillText('でした',W/2,by+325);x.textAlign='left';

  // message
  let y=by+bh+85;
  x.fillStyle=C.ink;x.font=`500 32px ${SANS}`;
  y+=wrap(x,'条件変更はいつでも可能ですので、遠慮なくお声掛けください。',L,y,CW,50);
  y+=30;

  // tips
  const tips=[
    ['少ないと感じている方','利回りを少し下げるだけで件数の増加が望めます。条件を緩和して、業者様とのパイプ作りをするのもおすすめです。'],
    ['多いと感じている方','エリアを市町村単位に絞ったり、利回りを少しきつめに設定すると、精査がしやすくなりおすすめです。']
  ];
  for(const [h,t] of tips){
    x.font=`400 28px ${SANS}`;
    // measure height
    const tmp=document.createElement('canvas').getContext('2d');tmp.font=x.font;
    let lines=1,line='';for(const ch of t){const s=line+ch;if(tmp.measureText(s).width>CW-80&&line){lines++;line=ch}else line=s}
    const bh2=90+lines*44+20;
    x.fillStyle=C.tint;rr(x,L,y,CW,bh2,8);x.fill();
    x.fillStyle=C.brass;x.fillRect(L,y+28,6,40);
    x.fillStyle=C.green;x.font=`700 30px ${SANS}`;x.fillText(h,L+40,y+60);
    x.fillStyle=C.ink;x.font=`400 28px ${SANS}`;wrap(x,t,L+40,y+108,CW-80,44);
    y+=bh2+24;
  }

  // footer
  x.strokeStyle=C.line;x.lineWidth=1;x.beginPath();x.moveTo(L,H-150);x.lineTo(R,H-150);x.stroke();
  x.fillStyle=C.soft;x.font=`500 26px ${SANS}`;
  x.fillText(`${m}月末 締め`,L,H-100);
  if(sender){x.textAlign='right';x.fillStyle=C.ink;x.font=`500 28px ${SERIF}`;x.fillText(sender,R,H-100);x.textAlign='left'}

  $('out').src=cv.toDataURL('image/png');
}

let lastCanvas=null;
let t;function sched(){clearTimeout(t);t=setTimeout(draw,120)}
['name','month','count','sender'].forEach(id=>$(id).addEventListener('input',sched));
$('f').addEventListener('submit',e=>e.preventDefault());

$('save').addEventListener('click',()=>{
  clearTimeout(t);draw();
  const {n,m}=msg();const fname=`報告件数_${n.replace(/[\s\\/:*?"<>|]/g,'')}_${m}月.png`;
  const say=x=>{$('toast').textContent=x;setTimeout(()=>$('toast').textContent='',3500)};
  lastCanvas.toBlob(async blob=>{
    if(!blob){say('画像を作れませんでした。画像を長押しして保存してください');return}
    const file=new File([blob],fname,{type:'image/png'});
    try{
      const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.userAgent));
      if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
    }catch(e){if(e&&e.name==='AbortError')return}
    try{
      const url=URL.createObjectURL(blob);const a=document.createElement('a');
      a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);say('画像を保存しました');
    }catch(e){say('保存できませんでした。画像を長押しして保存してください')}
  },'image/png');
});

$('copy').addEventListener('click',()=>{
  const {n,m,c}=msg();
  const s=`${n}さま\n\nいつもありがとうございます。\n${m}月の新規報告件数は${c}件でした。\n\n条件変更はいつでも可能ですので、遠慮なくお声掛けください。\n\n【少ないと感じている方】\n利回りを少し下げるだけで件数の増加が望めます。条件を緩和して、業者様とのパイプ作りをするのもおすすめです。\n\n【多いと感じている方】\nエリアを市町村単位に絞ったり、利回りを少しきつめに設定すると、精査がしやすくなりおすすめです。`;
  const done=()=>{$('toast').textContent='文面をコピーしました';setTimeout(()=>$('toast').textContent='',2500)};
  try{navigator.clipboard.writeText(s).then(done).catch(()=>{$('toast').textContent='コピーできませんでした。お手数ですが手動で選択してください'})}catch(e){}
});

(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>Promise.all([
  document.fonts.load(`700 68px "Zen Old Mincho"`),document.fonts.load(`500 32px "Zen Kaku Gothic New"`),
  document.fonts.load(`700 30px "Zen Kaku Gothic New"`),document.fonts.load(`600 210px "Cormorant Garamond"`)
]).catch(()=>{})).then(draw);
draw();
</script>
</body>
</html>
